version: 2

models:
  - name: mart_mrr_bridge
    description: Monthly MRR bridge in dollars with customer counts and retention rates.
    columns:
      - name: month
        data_tests: [unique, not_null]

  - name: mart_plan_summary
    description: Paying customers, MRR and ARPA by plan tier and billing interval per month.
    columns:
      - name: plan_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['starter', 'growth', 'scale']

  - name: mart_cohort_retention
    description: >
      Logo and net revenue retention by first-paid-month cohort and months since start.
      Month 0 is 100% by construction.
    columns:
      - name: cohort_month
        data_tests: [not_null]
      - name: logo_retention_pct
        data_tests: [not_null]
