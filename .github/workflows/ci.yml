name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/

      - name: Unit tests
        run: uv run pytest

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          uv sync
          cd dashboard && npm ci

      - name: Generate and load
        run: |
          uv run revmon generate
          uv run revmon load

      - name: dbt build
        run: uv run dbt build --profiles-dir .

      - name: Metrics
        run: uv run revmon metrics

      - name: Integration tests
        run: uv run pytest -m integration

      - name: Dashboard build
        run: |
          cd dashboard
          npm run sources
          npm run build:strict
